<!doctype html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="description" content="Halaman tidak ditemukan — AsherMod">
    <meta name="robots" content="noindex, follow">
    <title>404 — Halaman Tidak Ditemukan | AsherMod</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/jpeg" href="/assets/image/profile.jpg">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/image/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/image/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/image/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script>
        (function() {
            var root = document.documentElement;
            var ua = navigator.userAgent.toLowerCase();
            var isAndroid = ua.includes("android");
            var isWebView = isAndroid && (ua.includes(" wv)") || ua.includes(";wv)") || ua.includes("wv "));
            var is1DM = ua.includes("1dm") || ua.includes("1dmb") || ua.includes("idmbrowser");
            var lowMemory = navigator.deviceMemory && navigator.deviceMemory <= 2;
            var noBackdrop = !CSS.supports("backdrop-filter", "blur(5px)");
            if (isWebView || is1DM) root.classList.add("is-webview");
            if (lowMemory) root.classList.add("low-end");
            if (noBackdrop) root.classList.add("no-blur");
            if (is1DM) root.classList.add("is-1dm");
            if (isWebView || is1DM || lowMemory) root.classList.add("lite-mode");
            var savedTheme = localStorage.getItem('asher-theme') || 'dark';
            root.setAttribute('data-theme', savedTheme);
        })();
    </script>

    <style>
        :root {
            --bg: #0a0a0f;
            --bg-secondary: #0f0f1a;
            --fg: #f0f0f5;
            --fg-secondary: #d1d5db;
            --muted: #6b7280;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --card: rgba(255, 255, 255, 0.03);
            --card-hover: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.15);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.4);
            --shadow-glow: 0 8px 30px rgba(59, 130, 246, 0.2);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-full: 999px;
            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        html[data-theme="light"] {
            --bg: #f5f5f8;
            --bg-secondary: #ffffff;
            --fg: #1a1a2e;
            --fg-secondary: #374151;
            --muted: #9ca3af;
            --card: rgba(0, 0, 0, 0.02);
            --card-hover: rgba(0, 0, 0, 0.04);
            --border: rgba(0, 0, 0, 0.08);
            --border-hover: rgba(0, 0, 0, 0.15);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.1);
            --shadow-glow: 0 8px 30px rgba(59, 130, 246, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background var(--transition-smooth), color var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        .font-display {
            font-family: 'Space Grotesk', sans-serif;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Background gradients */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .bg-layer::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
            animation: bgMove 22s ease-in-out infinite;
        }
        html[data-theme="light"] .bg-layer::before {
            opacity: 0.5;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(59, 130, 246, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(139, 92, 246, 0.04) 0%, transparent 50%);
        }
        @keyframes bgMove {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
            50%      { transform: translate(-2%, 2%) rotate(-1deg) scale(1.03); }
        }

        .noise-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        /* =====================
           THEME TOGGLE
        ===================== */
        .theme-toggle {
            position: fixed;
            top: 1.25rem;
            left: 1.25rem;
            width: 36px;
            height: 36px;
            padding: 0;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: #1a1a2e;
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #f0f0f5;
            transition: all var(--transition-smooth);
            z-index: 9999;
            overflow: hidden;
        }
        html[data-theme="light"] .theme-toggle {
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(0, 0, 0, 0.12);
            color: #1a1a2e;
        }
        .theme-toggle:hover {
            background: rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.4);
            transform: rotate(15deg);
        }
        .theme-toggle:active {
            transform: rotate(15deg) scale(0.93);
        }
        .theme-toggle .icon-sun,
        .theme-toggle .icon-moon {
            position: absolute;
            transition: all var(--transition-bounce);
            width: 18px;
            height: 18px;
        }
        html[data-theme="dark"] .theme-toggle .icon-sun {
            opacity: 0;
            transform: scale(0) rotate(-90deg);
        }
        html[data-theme="dark"] .theme-toggle .icon-moon {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }
        html[data-theme="light"] .theme-toggle .icon-sun {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }
        html[data-theme="light"] .theme-toggle .icon-moon {
            opacity: 0;
            transform: scale(0) rotate(90deg);
        }

        /* =====================
           CONTENT
        ===================== */
        .wrap {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 460px;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.7s ease forwards;
        }
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .code-wrap {
            position: relative;
            display: inline-block;
            margin-bottom: 1.25rem;
        }
        .code {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(5.5rem, 24vw, 9rem);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, #60a5fa, #8b5cf6, #60a5fa);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 4s ease-in-out infinite;
            display: inline-block;
        }
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50%      { background-position: 100% 50%; }
        }

        .code-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: var(--accent-glow);
            filter: blur(60px);
            z-index: -1;
            opacity: 0.5;
            animation: glowPulse 3.5s ease-in-out infinite;
        }
        @keyframes glowPulse {
            0%, 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
            50%      { opacity: 0.7; transform: translate(-50%, -50%) scale(1.1); }
        }

        .title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 0.65rem;
            color: var(--fg);
        }

        .desc {
            color: var(--muted);
            font-size: 0.92rem;
            line-height: 1.65;
            margin-bottom: 2rem;
            max-width: 340px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            max-width: 260px;
            padding: 0.9rem 1.4rem;
            border-radius: var(--radius-md);
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            border: 1px solid transparent;
            transition: all var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: #fff;
            border-color: rgba(96, 165, 250, 0.35);
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.25);
        }
        .btn-primary:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(37, 99, 235, 0.4);
        }
        .btn-primary:active {
            transform: translateY(0) scale(0.98);
            transition: transform 0.1s ease;
        }

        .btn-secondary {
            background: var(--card);
            color: var(--fg);
            border-color: var(--border);
        }
        .btn-secondary:hover {
            background: var(--card-hover);
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }
        .btn-secondary:active {
            transform: translateY(0) scale(0.98);
            transition: transform 0.1s ease;
        }

        .btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .footer-note {
            margin-top: 2.5rem;
            color: var(--muted);
            font-size: 0.72rem;
            opacity: 0.7;
            font-style: italic;
        }

        /* =====================
           LITE MODE
        ===================== */
        html.lite-mode .bg-layer,
        html.lite-mode .noise-overlay {
            display: none !important;
        }
        html.lite-mode .code,
        html.lite-mode .code-glow {
            animation: none !important;
        }
        html.lite-mode .wrap {
            animation: none !important;
            opacity: 1 !important;
            transform: none !important;
        }

        /* =====================
           REDUCED MOTION
        ===================== */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* =====================
           RESPONSIVE
        ===================== */
        @media (max-width: 480px) {
            body { padding: 1.5rem 1rem; }
            .theme-toggle {
                top: 0.75rem;
                left: 0.75rem;
            }
            .title { font-size: 1.2rem; }
            .desc { font-size: 0.86rem; }
        }
    </style>
</head>
<body>

    <div class="bg-layer" aria-hidden="true"></div>
    <div class="noise-overlay" aria-hidden="true"></div>

    <button class="theme-toggle" id="themeToggle" aria-label="Ganti tema" title="Ganti tema">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>

    <main class="wrap">
        <div class="code-wrap">
            <div class="code-glow" aria-hidden="true"></div>
            <div class="code font-display" aria-hidden="true">404</div>
        </div>
        <h1 class="title font-display">Halaman Tidak Ditemukan</h1>
        <p class="desc">Link yang kamu tuju udah nggak ada, salah ketik, atau dipindahin ke tempat lain. Balik ke halaman utama aja ya.</p>
        <div class="btn-group">
            <a class="btn btn-primary" href="/">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                Kembali ke Beranda
            </a>
            <a class="btn btn-secondary" href="/referral.html">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1"></path>
                    <path d="M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1"></path>
                </svg>
                Lihat Referral
            </a>
        </div>
        <p class="footer-note">Powered by AsherMod</p>
    </main>

    <script>
        (function() {
            var html = document.documentElement;
            var themeToggle = document.getElementById('themeToggle');

            function setTheme(theme) {
                html.setAttribute('data-theme', theme);
                localStorage.setItem('asher-theme', theme);
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', theme === 'light' ? '#f5f5f8' : '#0a0a0f');
            }

            if (themeToggle) {
                themeToggle.addEventListener('click', function() {
                    setTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
                });
            }

            // Sync theme saat balik dari tab lain
            window.addEventListener('storage', function(e) {
                if (e.key === 'asher-theme' && e.newValue) {
                    html.setAttribute('data-theme', e.newValue);
                }
            });
        })();
    </script>
</body>
</html>
